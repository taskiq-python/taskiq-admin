[project]
name = "taskiq-admin-client"
description = "Schedule management client for taskiq-admin"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
keywords = ["taskiq", "admin", "scheduler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Networking",
  "Typing :: Typed"
]
dependencies = [
  "aiohttp>=3",
  "taskiq>=0.12.5"
]

[project.urls]
Repository = "https://github.com/taskiq-python/taskiq-admin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskiq_admin_client"]
